{{- range $dashboard, $_ := .Files.Glob "dashboards/*.json" }}
{{- $base := base $dashboard -}}
{{- $name := printf "%s" (trimSuffix ".json" $base) | trunc 63 | trimPrefix "-" | trimSuffix "-" -}}

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $name | quote }}
  labels:
    app.kubernetes.io/name: {{ $name | quote }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  contentCacheDuration: 30s
  folder: Operations
  json: |-
    {{- /* Load and sanitize JSON; enforce unique uid, drop id */ -}}
    {{- $obj := ($.Files.Get $dashboard | fromJson) -}}
    {{- $_ := set $obj "uid" $name -}}
    {{- $_ := unset $obj "id" -}}
    {{- toJson $obj | nindent 4 }}
{{- printf "\n" -}}
{{- end }}
