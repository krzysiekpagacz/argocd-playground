{{- range $dashboard, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := printf "%s" (trimSuffix ".json" (base $dashboard)) }}
{{- /*Truncate to 63 characters (Kubernetes DNS-1123 max) and
ensure it does not start/end with '-' after truncation.*/ -}}
{{- $name := $name | trunc 63 | trimPrefix "-" | trimSuffix "-" -}}

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $name | quote }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  contentCacheDuration: 30s
  folder: Operations
  json: |-
    {{- /* Load JSON into a map so we can mutate it */ -}}
    {{- $obj := ($.Files.Get $dashboard | fromJson) -}}
    {{- /* Ensure a unique UID per file (use the CR/resource name) */ -}}
    {{- $_ := set $obj "uid" $name -}}
    {{- /* Remove any numeric or non-null id that may cause issues */ -}}
    {{- $_ := unset $obj "id" -}}
    {{- /* Emit the sanitized JSON */ -}}
    {{- toJson $obj | nindent 4 }}
{{- end }}
