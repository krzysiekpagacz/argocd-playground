
apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
  namespace: workflows
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      # Keep the pod alive
      command: ["sh", "-c", "sleep infinity"]
      # Optional: set an HTTP(S) proxy if your cluster egress requires it
      # env:
      #   - name: HTTP_PROXY
      #     value: "http://proxy:3128"
      #   - name: HTTPS_PROXY
      #     value: "http://proxy:3128"
      #   - name: NO_PROXY
      #     value: "127.0.0.1,localhost,.svc,.cluster.local"
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
  restartPolicy: Never

