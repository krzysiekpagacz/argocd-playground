apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: hello-world-parameter
  namespace: workflows
spec:
  entrypoint: print-message
  serviceAccountName: workflow-executor
  arguments:
    parameters:
    - name: message
      value: hello world
      description: "the input parameter from the Argo UI"

  templates:
  - name: print-message
    inputs:
      parameters:
      - name: message
    container:
      image: busybox
      command: [echo]
      args: ["{{inputs.parameters.message}}"]