apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: update-confluence
  namespace: workflows
spec:
  entrypoint: main
  serviceAccountName: workflow-executor
  arguments:
    parameters:
      - name: api_root
        value: "https://confluence.telekom-mms.com"
      - name: page_id
        value: "1175330814"
      - name: expected_title
        value: "Argo Workflows"
      - name: dummy_text
        value: "<p><strong>Dummy update:</strong> Added by Argo at {{workflow.creationTimestamp}}.</p>"

  templates:
    - name: main
      steps:
        - - name: get-page
            template: http-get
            arguments:
              parameters:
                - name: url
                  value: "{{workflow.parameters.api_root}}/rest/api/content/{{workflow.parameters.page_id}}?expand=version,body.storage,title"
        - - name: debug
            template: inspect-respone-body
            arguments:
              parameters:
                - name: label
                  value: "GET page response (body)"
                - name: payload
                  value: "{{steps.get-page.outputs.result}}"

        # - - name: put-page
        #     template: http-put
        #     arguments:
        #       parameters:
        #         - name: page_id
        #           value: "{{workflow.parameters.page_id}}"
        #         - name: api_root
        #           value: "{{workflow.parameters.api_root}}"
        #         # Extract from outputs.result using jsonpath
        #         - name: title
        #           value: "{{= jsonpath(steps.get-page.outputs.result, '$.title') }}"
        #         - name: current_version
        #           value: "{{= jsonpath(steps.get-page.outputs.result, '$.version.number') }}"
        #         - name: existing_body
        #           value: "{{= jsonpath(steps.get-page.outputs.result, '$.body.storage.value') }}"
        #         - name: dummy_text
        #           value: "{{workflow.parameters.dummy_text}}"

    # --- HTTP GET (Agent) ---
    - name: http-get
      inputs:
        parameters:
          - name: url
      http:
        method: "GET"
        url: "{{inputs.parameters.url}}"
        timeoutSeconds: 20
        headers:
          - name: "Authorization"
            value: "Bearer OTUwMzk2NjI2MzM5Omfm9Me0o9chjCflIr6w2/vJEOrs" # <-- test token
          - name: "Accept"
            value: "application/json"
        # Ensure step succeeds so downstream can read outputs.result
        successCondition: "response.statusCode == 200"
      # NOTE: HTTP templates automatically expose response body in outputs.result. [1](https://argo-workflows.readthedocs.io/en/latest/walk-through/output-parameters/)



    - name: inspect-respone-body
      inputs:
        parameters:
          - name: label
          - name: payload
      script:
        image: alpine:3.19
        command: ["/bin/bash"]
        source: |
          echo "=== {{inputs.parameters.label}} ==="
          echo "{{inputs.parameters.payload}}"      

