
apiVersion: v1
kind: Pod
metadata:
  name: mariadb-test-client
  labels:
    app: mariadb-client
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: mysql:8.4
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      # Keep the pod alive; you will exec into it
      args: ["sleep infinity"]
      volumeMounts:
        - name: admin-password
          mountPath: /var/run/creds/admin
          readOnly: true
      # (optional) security hardening
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        allowPrivilegeEscalation: false
  volumes:
    - name: admin-password
      secret:
        secretName: admin-password
        items:
          - key: password
            path: password
