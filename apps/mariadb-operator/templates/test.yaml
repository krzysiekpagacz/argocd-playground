apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.releaseName }}-application"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krzysiekpagacz/argocd-playground.git
    targetRevision: {{ .Values.targetRevision }}
    path: charts/mariadb-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespace }}
  syncPolicy:
    automated:
      prune: true
