{{/* The subchart used to feed the calling chart with values for the mariadb-cluster chart */}}
{{/* Full values reference: https://github.com/mariadb-operator/mariadb-operator/blob/main/deploy/charts/mariadb-cluster/README.md */}}
{{- define "mariadbCluster.computedValues" -}}
{{- $cluster := default (dict) .Values.cluster -}}
{{- $rootPass := default (dict) $cluster.rootPasswordSecretKeyRef -}}
{{- $galeraEnabled := default false (or $cluster.galeraEnabled (and (hasKey $cluster "galera") (get $cluster.galera "enabled"))) -}}

mariadb:
  rootPasswordSecretKeyRef:
    name: {{ default "mariadb" $rootPass.name | quote }}
    key:  {{ default "root-password" $rootPass.key | quote }}
    generate: true

  storage:
    size: 1Gi
  replicas: {{ default 3 $cluster.replicas }}
  galera:
    enabled: {{ $galeraEnabled }}

  # ToDo(kp): for the MariaDB cluster bootstrapping it is required to have access to the Volume owned by root user, hence runAsUser=0
  # podSecurityContext:
  #   runAsUser: 0

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999


{{- end -}}
