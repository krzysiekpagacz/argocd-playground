apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "mariadb-resources-app"
  namespace: argocd
spec:
  project: {{ .Values.projectName }}
  source:
    repoURL: https://github.com/krzysiekpagacz/argocd-playground.git
    targetRevision: {{ .Values.targetRevision }}
    path: charts/mariadb-resources
    helm:
      valuesObject:
        {{- include "mariadbResources.computedValues" . | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
